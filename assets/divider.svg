<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="img" aria-label="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#7C3AED"/>
      <stop offset="40%"  stop-color="#2563EB"/>
      <stop offset="62%"  stop-color="#0891B2"/>
      <stop offset="84%"  stop-color="#059669"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.6 0; 0.6 0; -0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="3.5" width="1200" height="3" rx="1.5" fill="url(#d)"/>
  <rect y="3.5" width="180" height="3" rx="1.5" fill="url(#spark)" opacity=".7">
    <animate attributeName="x" values="-180;1200;-180" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
