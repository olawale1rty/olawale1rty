<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mustapha Moshood Olawale — Senior Software Engineer, AI/ML Engineer, Founder, Geospatial Technologist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070D1A"/>
      <stop offset="55%" stop-color="#0D1730"/>
      <stop offset="100%" stop-color="#0A1426"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0891B2" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="35%" stop-color="#2563EB"/>
      <stop offset="70%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>

    <style>
      .name {
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700; font-size: 52px; fill: #F8FAFC; letter-spacing: .5px;
        animation: rise 1.1s ease-out both;
      }
      .role {
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600; font-size: 24px; letter-spacing: 3px;
        opacity: 0; animation: cycle 16s ease-in-out infinite;
      }
      .r1 { fill: #22D3EE; animation-delay: 0s; }
      .r2 { fill: #A78BFA; animation-delay: 4s; }
      .r3 { fill: #34D399; animation-delay: 8s; }
      .r4 { fill: #60A5FA; animation-delay: 12s; }

      .tag {
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500; font-size: 15px; fill: #94A3B8; letter-spacing: 1.5px;
        animation: fade 1.4s ease-out .5s both;
      }
      .rule { animation: grow 1.3s cubic-bezier(.2,.8,.2,1) .25s both; transform-origin: 600px 0; }

      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        4%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        26%  { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- drifting colour fields -->
    <ellipse cx="220" cy="90" rx="300" ry="190" fill="url(#blobA)">
      <animate attributeName="cx" values="220;380;220" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;150;90" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="260" rx="320" ry="200" fill="url(#blobB)">
      <animate attributeName="cx" values="980;820;980" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;200;260" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="330" rx="340" ry="160" fill="url(#blobC)">
      <animate attributeName="cy" values="330;300;330" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <!-- orbit motif, left -->
    <g transform="translate(150,170)" opacity=".85">
      <circle r="52" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/>
      <ellipse rx="86" ry="32" fill="none" stroke="#A78BFA" stroke-opacity=".45" stroke-width="1.5"
               transform="rotate(-24)"/>
      <circle r="4.5" fill="#22D3EE">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"
          path="M86,0 A86,32 0 1,1 -86,0 A86,32 0 1,1 86,0" />
      </circle>
      <circle r="20" fill="#22D3EE" fill-opacity=".12"/>
      <circle r="20" fill="none" stroke="#67E8F9" stroke-opacity=".5" stroke-width="1">
        <animate attributeName="r" values="20;30;20" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".5;0;.5" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- orbit motif, right -->
    <g transform="translate(1050,170)" opacity=".7">
      <ellipse rx="74" ry="28" fill="none" stroke="#34D399" stroke-opacity=".4" stroke-width="1.5"
               transform="rotate(18)"/>
      <circle r="3.5" fill="#34D399">
        <animateMotion dur="9s" repeatCount="indefinite"
          path="M74,0 A74,28 0 1,0 -74,0 A74,28 0 1,0 74,0" />
      </circle>
      <circle r="16" fill="#34D399" fill-opacity=".12"/>
    </g>

    <!-- content -->
    <text class="name" x="600" y="140" text-anchor="middle">Mustapha Moshood Olawale</text>

    <rect class="rule" x="440" y="163" width="320" height="3" rx="1.5" fill="url(#rule)"/>

    <g>
      <text class="role r1" x="600" y="212" text-anchor="middle">SENIOR SOFTWARE ENGINEER</text>
      <text class="role r2" x="600" y="212" text-anchor="middle">AI / ML ENGINEER</text>
      <text class="role r3" x="600" y="212" text-anchor="middle">FOUNDER</text>
      <text class="role r4" x="600" y="212" text-anchor="middle">GEOSPATIAL TECHNOLOGIST</text>
    </g>

    <text class="tag" x="600" y="258" text-anchor="middle">SOFTWARE  ×  ARTIFICIAL INTELLIGENCE  ×  GEOSPATIAL INTELLIGENCE  ×  DATA</text>

    <!-- scanning sweep -->
    <rect y="0" width="1200" height="340" fill="url(#sweep)" opacity=".22"/>
    <rect x="0" y="336" width="1200" height="4" fill="url(#rule)"/>
  </g>
</svg>
