# Place at: .github/workflows/metrics.yml
#
# Generates stats SVGs inside THIS repo using your own GitHub token.
# No third-party host is involved, so nothing here can be paused, rate-limited
# or shut down by someone else. Output files land in the repo root:
#
#   github-metrics.svg            overview + languages
#   github-metrics-calendar.svg   full-year contribution calendar
#   github-metrics-achievements.svg   achievements (replaces the trophy cards)
#
# ── SETUP (one time) ─────────────────────────────────────────────────────────
# 1. Create a classic PAT:  https://github.com/settings/tokens/new
#       - Scope: public_repo   (add "repo" as well if you want private repos counted)
#       - Expiration: No expiration. An expired token is the single most common
#         cause of these cards silently going blank later.
# 2. Add it to this repo:  Settings → Secrets and variables → Actions → New secret
#       - Name: METRICS_TOKEN
#       - Value: the token
# 3. Settings → Actions → General → Workflow permissions → Read and write
# 4. Actions tab → "Generate metrics" → Run workflow
# ─────────────────────────────────────────────────────────────────────────────

name: Generate metrics

on:
    schedule:
        - cron: "0 4 * * *" # daily at 04:00 UTC (05:00 Lagos)
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    metrics:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            # ── Overview + most used languages ──────────────────────────────────
            # - name: Overview and languages
            #   uses: lowlighter/metrics@latest
            #   with:
            #       token: ${{ secrets.METRICS_TOKEN }}
            #       filename: github-metrics.svg
            #       template: classic
            #       base: header, activity, community, repositories, metadata
            #       config_timezone: Africa/Lagos
            #       extras_css: |
            #           .background { fill: #0D1117; stroke: #30363D; }
            #           h2, h2.field { fill: #A78BFA !important; color: #A78BFA !important; }
            #           text, tspan, .field, div, span, p { fill: #C9D1D9; color: #C9D1D9; }
            #       plugin_languages: yes
            #       plugin_languages_details: percentage, bytes-size
            #       plugin_languages_limit: 8
            #       plugin_languages_sections: most-used
            #       plugin_languages_threshold: 1%

            # ── Full-year contribution calendar ─────────────────────────────────
            - name: Contribution calendar
              uses: lowlighter/metrics@latest
              with:
                  token: ${{ secrets.METRICS_TOKEN }}
                  filename: github-metrics-calendar.svg
                  base: ""
                  config_timezone: Africa/Lagos
                  extras_css: |
                      .background { fill: #0D1117; stroke: #30363D; }
                      h2, h2.field { fill: #A78BFA !important; color: #A78BFA !important; }
                      text, tspan, .field, div, span, p { fill: #C9D1D9; color: #C9D1D9; }
                  plugin_isocalendar: yes
                  plugin_isocalendar_duration: full-year

            # ── Achievements (the trophy replacement) ───────────────────────────
